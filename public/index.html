<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BimalAI</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div id="loginScreen" class="screen">
    <div class="login-card">
        <div class="logo">✦</div>
        <h1>BimalAI</h1>
        <p class="subtitle">Bimal & Simran's Personal AI Assistant</p>

```
    <form id="loginForm">
        <input id="username" type="text" placeholder="Username" autocomplete="username" required>
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit">Login</button>
        <div id="loginError" class="error"></div>
    </form>
</div>
```

</div>

<div id="appScreen" class="app hidden">

```
<aside class="sidebar">

    <div class="brand">
        <div class="brand-icon">✦</div>
        <div>
            <strong>BimalAI</strong>
            <small>Personal AI</small>
        </div>
    </div>

    <button id="newChatBtn" class="new-chat">＋ New conversation</button>

    <div class="section-title">RECENT CONVERSATIONS</div>

    <div id="chatList" class="chat-list"></div>

    <div class="sidebar-bottom">
        <button id="logoutBtn" class="logout">Logout</button>
    </div>

</aside>

<main class="main">

    <header class="topbar">
        <div>
            <h2 id="chatTitle">New conversation</h2>
            <span id="modeLabel">General</span>
        </div>

        <div class="top-actions">
            <select id="modelSelect">
                <option value="openrouter/free">Free model</option>
            </select>

            <select id="modeSelect">
                <option value="">General</option>
                <option value="study">Study</option>
                <option value="coding">Coding</option>
                <option value="writing">Writing</option>
                <option value="planning">Planning</option>
                <option value="explain">Explain</option>
            </select>

            <button id="renameBtn" title="Rename conversation">✎</button>
            <button id="deleteBtn" title="Delete conversation">🗑</button>
        </div>
    </header>

    <section id="messages" class="messages">

        <div id="welcome" class="welcome">
            <div class="welcome-icon">✦</div>
            <h1>BimalAI</h1>
            <p>Your personal AI assistant</p>

            <div class="suggestions">
                <button data-prompt="Explain this concept to me simply.">Explain something</button>
                <button data-prompt="Help me make a study plan.">Create study plan</button>
                <button data-prompt="Help me write something professionally.">Write something</button>
                <button data-prompt="Help me with coding.">Help with coding</button>
            </div>
        </div>

    </section>

    <div id="filePreview" class="file-preview hidden"></div>

    <form id="chatForm" class="composer">

        <input
            id="fileInput"
            type="file"
            multiple
            hidden
            accept=".pdf,.docx,.txt,.csv,.json,.md,.png,.jpg,.jpeg,.webp,.gif"
        >

        <button type="button" id="attachBtn" class="icon-btn" title="Attach files">
            📎
        </button>

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Message BimalAI..."
            autocomplete="off"
        ></textarea>

        <button id="sendBtn" type="submit" class="send-btn">
            ➤
        </button>

    </form>

    <div class="composer-note">
        BimalAI can make mistakes. Check important information.
    </div>

</main>
```

</div>

<script src="/app.js"></script>

</body>
</html>
